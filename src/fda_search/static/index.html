<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FDA 公开检查与合规记录全文搜索">
  <meta name="theme-color" content="#0a192b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a192b'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='24' font-weight='700' fill='%23bfe3f7' text-anchor='middle'%3EFDA%3C/text%3E%3C/svg%3E">
  <title>FDA 全局搜索</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="FDA 全局搜索首页">
        <span class="brand-mark" aria-hidden="true">FDA</span>
        <span>Global Search</span>
      </a>
      <div class="index-status" id="index-status">正在读取索引状态…</div>
    </div>
  </header>

  <main>
    <section class="search-section" aria-labelledby="page-title">
      <div class="shell">
        <p class="eyebrow">FDA PUBLIC RECORDS</p>
        <h1 id="page-title">FDA 全局搜索</h1>

        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="query">搜索 FDA 记录</label>
          <div class="search-input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
            <input id="query" name="q" type="search" autocomplete="off" placeholder="例如：sterility testing、warning letter、企业名称">
          </div>
          <button type="submit">搜索</button>
        </form>

        <div class="filters" aria-label="筛选条件">
          <div>
            <label for="record-type" lang="en">Record type</label>
            <select id="record-type" name="record_type"><option value="">全部类型</option></select>
          </div>
          <div>
            <label for="state">州 / 地区</label>
            <select id="state" name="state"><option value="">全部地区</option></select>
          </div>
          <div>
            <label for="year">记录年份</label>
            <select id="year" name="year"><option value="">全部年份</option></select>
          </div>
          <button class="clear-button" id="clear-filters" type="button">清除筛选</button>
        </div>
      </div>
    </section>

    <section class="results-section shell" aria-labelledby="results-heading">
      <div class="results-heading">
        <div>
          <h2 id="results-heading">全部记录</h2>
          <div class="result-summary-row">
            <p id="result-summary" aria-live="polite">正在加载…</p>
            <button class="new-records-button" id="refresh-results" type="button" hidden>
              有新记录，刷新结果
            </button>
          </div>
        </div>
      </div>
      <div id="results" class="results"></div>
      <nav class="pagination" id="pagination" aria-label="搜索结果分页" hidden>
        <button id="previous-page" type="button">上一页</button>
        <span id="page-status"></span>
        <button id="next-page" type="button">下一页</button>
      </nav>
    </section>
  </main>

  <footer>
    <div class="shell">数据来源 U.S. Food &amp; Drug Administration · 结果以 FDA 官方原始文件为准</div>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
